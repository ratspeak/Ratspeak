name: ratspeak
options:
  bundleIdPrefix: org.ratspeak.ios
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Ratspeak
      PRODUCT_BUNDLE_IDENTIFIER: org.ratspeak.ios
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  ratspeak_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: ratspeak_iOS
      - path: ratspeak_iOS/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    # Keep App Store permission, background, and URL declarations in the generated
    # static Info.plist. Build-time plist rewriting can race Xcode signing and
    # invalidate an otherwise valid app.
    info:
      path: ratspeak_iOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: ratspeak
            CFBundleURLSchemes:
              - ratspeak
        LSRequiresIPhoneOS: true
        NSBluetoothAlwaysUsageDescription: Ratspeak uses Bluetooth to connect to hardware nodes and other Bluetooth peers when enabled.
        NSBluetoothPeripheralUsageDescription: Ratspeak uses Bluetooth to connect to hardware nodes and other Bluetooth peers when enabled.
        NSBonjourServices:
          - _reticulum._udp
        NSCameraUsageDescription: Ratspeak accesses your camera so you can take photos or videos to send in a message.
        NSLocalNetworkUsageDescription: Required when you enable a TCP, Local, or Bluetooth Peer interface in Network settings so Ratspeak can reach other nodes on your local network.
        NSMicrophoneUsageDescription: Ratspeak uses your microphone for voice calls, voice messages, and videos you choose to record.
        NSPhotoLibraryAddUsageDescription: Ratspeak saves received images to your photo library when you choose Save to Photos.
        NSPhotoLibraryUsageDescription: Ratspeak accesses your photo library so you can attach existing photos or videos to a message.
        UIBackgroundModes:
          - audio
          - bluetooth-central
          - bluetooth-peripheral
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        CFBundleShortVersionString: 1.0.26
        CFBundleVersion: "1.0.26"
    entitlements:
      path: ratspeak_iOS/ratspeak_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        # One universal iOS target supports both iPhone and iPad. Keep this in
        # the XcodeGen source so project regeneration cannot become
        # accidentally iPhone-only.
        TARGETED_DEVICE_FAMILY: "1,2"
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreBluetooth.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: cargo tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
