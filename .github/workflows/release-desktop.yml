name: Release Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: "Publish Linux artifacts to a GitHub Release"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag to publish when manually dispatching."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            bundles: deb appimage rpm
            artifact_name: ratspeak-linux-amd64
            deb_name: linux-amd64.deb
            deb_arch: amd64
            appimage_name: linux-x86_64.AppImage
            rpm_name: linux-x86_64.rpm
          - arch: arm64
            runner: ubuntu-22.04-arm
            bundles: deb
            artifact_name: ratspeak-linux-arm64
            deb_name: linux-arm64.deb
            deb_arch: arm64
            appimage_name: ""
            rpm_name: ""
    steps:
      - name: Checkout Ratspeak
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Ratspeak
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Setup source qualification Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0

      - name: Load reviewed source set
        id: source
        shell: bash
        working-directory: Ratspeak
        run: node scripts/release/source-integrity.mjs github-outputs >> "$GITHUB_OUTPUT"

      - name: Checkout rsReticulum
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ steps.source.outputs.rsreticulum_ref }}
          path: rsReticulum
          fetch-depth: 0

      - name: Checkout rsLXMF
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ steps.source.outputs.rslxmf_ref }}
          path: rsLXMF
          fetch-depth: 0

      - name: Checkout rsLXST
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXST
          ref: ${{ steps.source.outputs.rslxst_ref }}
          path: rsLXST
          fetch-depth: 0

      - name: Checkout lrgp-rs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/lrgp-rs
          ref: ${{ steps.source.outputs.lrgp_ref }}
          path: lrgp-rs
          fetch-depth: 0

      - name: Verify reviewed source set
        shell: bash
        working-directory: Ratspeak
        run: node scripts/release/source-integrity.mjs verify-release-source

      - name: Verify publishing release ref
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        shell: bash
        working-directory: Ratspeak
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: node scripts/release/source-integrity.mjs verify-release-ref "$RELEASE_REF"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ steps.source.outputs.rust_toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: false
          workspaces: |
            Ratspeak
            Ratspeak/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux system deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libpcsclite-dev \
            libasound2-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            libfuse2 \
            rpm \
            file

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ steps.source.outputs.tauri_cli }}" --locked

      - name: Stage AppImage indicator runtime
        if: ${{ matrix.appimage_name != '' }}
        working-directory: Ratspeak
        run: bash scripts/release/stage-appimage-runtime.sh

      - name: Run tests
        working-directory: Ratspeak
        run: cargo test --workspace --locked

      - name: Build CSS
        shell: bash
        working-directory: Ratspeak
        run: bash dashboard/build-css.sh

      - name: Check Tauri desktop shell
        shell: bash
        working-directory: Ratspeak
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Tauri desktop app
        shell: bash
        working-directory: Ratspeak/src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          unset TAURI_CONFIG
          unset TAURI_DEV_HOST
          cargo tauri build --bundles ${{ matrix.bundles }} -- --locked

      - name: Check for bundled dev URLs
        shell: bash
        working-directory: Ratspeak
        run: bash scripts/release/assert-no-tauri-dev-url.sh src-tauri/target/release/bundle

      - name: Verify AppImage indicator runtime
        if: ${{ matrix.appimage_name != '' }}
        shell: bash
        working-directory: Ratspeak
        run: |
          mapfile -t appimages < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | sort)
          test "${#appimages[@]}" = "1"
          bash scripts/release/verify-appimage-runtime.sh "${appimages[0]}"

      - name: Stage Linux release artifacts
        shell: bash
        working-directory: Ratspeak
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          PUBLISH_GITHUB_RELEASE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
          DEB_NAME: ${{ matrix.deb_name }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          APPIMAGE_NAME: ${{ matrix.appimage_name }}
          RPM_NAME: ${{ matrix.rpm_name }}
          BOM_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_VERSION:?Missing release version.}"
          case "$release_version" in
            */*|*\\*)
              echo "Release version must not contain path separators: $release_version" >&2
              exit 1
              ;;
          esac

          out_dir="dist/linux"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"

          mapfile -t debs < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | sort)
          deb="${debs[0]:-}"
          test -n "$deb"

          deb_artifact="Ratspeak-${release_version}-${DEB_NAME}"
          cp "$deb" "$out_dir/$deb_artifact"
          dpkg-deb --info "$out_dir/$deb_artifact" >/dev/null
          actual_arch="$(dpkg-deb --field "$out_dir/$deb_artifact" Architecture)"
          if [ "$actual_arch" != "$DEB_ARCH" ]; then
            echo "Expected $deb_artifact architecture $DEB_ARCH, got $actual_arch"
            exit 1
          fi

          if [ -n "$APPIMAGE_NAME" ]; then
            mapfile -t appimages < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | sort)
            appimage="${appimages[0]:-}"
            test -n "$appimage"
            appimage_artifact="Ratspeak-${release_version}-${APPIMAGE_NAME}"
            cp "$appimage" "$out_dir/$appimage_artifact"
            chmod +x "$out_dir/$appimage_artifact"
            file "$out_dir/$appimage_artifact"
          fi

          if [ -n "$RPM_NAME" ]; then
            mapfile -t rpms < <(find src-tauri/target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' | sort)
            rpm="${rpms[0]:-}"
            test -n "$rpm"
            rpm_artifact="Ratspeak-${release_version}-${RPM_NAME}"
            cp "$rpm" "$out_dir/$rpm_artifact"
          fi

          source_args=(bom --output "$out_dir/Ratspeak-${release_version}-linux-${BOM_ARCH}-source-bom.json")
          if [[ "$PUBLISH_GITHUB_RELEASE" == "true" ]]; then
            source_args+=(--release-ref "$release_version")
          fi
          node scripts/release/source-integrity.mjs "${source_args[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            Ratspeak/dist/linux/*
          if-no-files-found: error
          retention-days: 1

  package:
    name: Linux package
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: ratspeak-linux-*
          path: Ratspeak/dist/linux
          merge-multiple: true

      - name: Validate Linux release artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_VERSION:?Missing release version.}"
          case "$release_version" in
            */*|*\\*)
              echo "Release version must not contain path separators: $release_version" >&2
              exit 1
              ;;
          esac

          amd64_deb="Ratspeak/dist/linux/Ratspeak-${release_version}-linux-amd64.deb"
          arm64_deb="Ratspeak/dist/linux/Ratspeak-${release_version}-linux-arm64.deb"
          appimage="Ratspeak/dist/linux/Ratspeak-${release_version}-linux-x86_64.AppImage"
          rpm="Ratspeak/dist/linux/Ratspeak-${release_version}-linux-x86_64.rpm"
          test -f "$amd64_deb"
          test -f "$arm64_deb"
          test -f "$appimage"
          test -f "$rpm"
          amd64_arch="$(dpkg-deb --field "$amd64_deb" Architecture)"
          arm64_arch="$(dpkg-deb --field "$arm64_deb" Architecture)"
          test "$amd64_arch" = "amd64"
          test "$arm64_arch" = "arm64"
          artifact_count="$(find Ratspeak/dist/linux -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$artifact_count" = "6"
          find Ratspeak/dist/linux -maxdepth 1 -type f -print | sort

      - name: Write Linux checksums
        shell: bash
        working-directory: Ratspeak
        run: |
          set -euo pipefail
          checksum_file="checksums-linux.txt"
          : > "$checksum_file"
          find dist/linux -type f -print0 |
            sort -z |
            while IFS= read -r -d '' artifact; do
              hash="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
              printf '%s  %s\n' "$hash" "$(basename "$artifact")" >> "$checksum_file"
            done
          test -s "$checksum_file"

      - name: Upload combined artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ratspeak-linux
          path: |
            Ratspeak/dist/linux/*
            Ratspeak/checksums-linux.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          body: |
            - Fixed RNode startup compatibility by treating optional EEPROM information as advisory instead of rejecting otherwise usable hardware, including the T114.
            - Restored reliable BLE transmission after an RNode connects.
            - Fixed Announce sometimes staying queued even while an external RNode was connected and ready to transmit.
            - Fixed Linux AppImage startup crashes caused by incompatible system AppIndicator and GLib libraries.
            - Simplified interface status messages so connection and hardware warnings are shown as plain yellow text instead of pill-shaped badges.
          files: |
            Ratspeak/dist/linux/*
            Ratspeak/checksums-linux.txt
