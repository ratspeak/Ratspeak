name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RATSPEAK_RSRETICULUM_REF: ab53670f988fc15a6a3ec0207932f63b6aa65534
  RATSPEAK_RSLXMF_REF: 1aee9dc1ed36e8f5078643c6290edca0b5e61aa5
  RATSPEAK_RSLXST_REF: 0df95692496c531269eec30f4b37e34c21ed9e32
  RATSPEAK_LRGP_REF: 6b3ca2936da8410fcca3e1eebaeb2c53de95a132

jobs:
  api-compat:
    name: Internal Rust API baseline
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Ratspeak
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RATSPEAK_RSRETICULUM_REF }}
          path: rsReticulum
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ env.RATSPEAK_RSLXMF_REF }}
          path: rsLXMF
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXST
          ref: ${{ env.RATSPEAK_RSLXST_REF }}
          path: rsLXST
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/lrgp-rs
          ref: ${{ env.RATSPEAK_LRGP_REF }}
          path: lrgp-rs
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-01
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: Ratspeak, Ratspeak/src-tauri
          cache-bin: true
      - name: Install API snapshot tool
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Check reviewed Rust API baseline
        run: python3 tools/check-api-baseline.py
        working-directory: Ratspeak
      - name: Check manifest and feature contract
        run: python3 tools/check-api-manifest.py
        working-directory: Ratspeak
      - name: Check additions-only compatibility floor
        run: python3 tools/check-api-compatibility.py
        working-directory: Ratspeak

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Ratspeak
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RATSPEAK_RSRETICULUM_REF }}
          path: rsReticulum
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ env.RATSPEAK_RSLXMF_REF }}
          path: rsLXMF
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXST
          ref: ${{ env.RATSPEAK_RSLXST_REF }}
          path: rsLXST
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/lrgp-rs
          ref: ${{ env.RATSPEAK_LRGP_REF }}
          path: lrgp-rs
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: false
          workspaces: Ratspeak
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libpcsclite-dev \
            libasound2-dev \
            libdbus-1-dev \
            pkg-config
      - name: Validate shell scripts
        run: bash -n dashboard/build-css.sh scripts/release/*.sh
        working-directory: Ratspeak
      - name: Validate Android JNI source boundary
        run: python3 scripts/release/assert-android-jni-boundaries.py source
        working-directory: Ratspeak
      - name: Validate ordinary workflow dependency pins
        run: bash scripts/ci/check-workflow-dependency-pins.sh
        working-directory: Ratspeak
      - name: Validate reviewed source set
        run: node --test scripts/release/source-integrity.test.mjs
        working-directory: Ratspeak
      - name: Build dashboard CSS
        run: bash dashboard/build-css.sh
        working-directory: Ratspeak
      - name: Test Rust workspace
        run: cargo test --workspace --locked
        working-directory: Ratspeak
      - name: Test dashboard behavior
        run: |
          for test in dashboard/scripts/test_*.js; do
            node "$test"
          done
        working-directory: Ratspeak
      - name: Check Tauri desktop shell
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
        working-directory: Ratspeak

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Ratspeak
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RATSPEAK_RSRETICULUM_REF }}
          path: rsReticulum
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ env.RATSPEAK_RSLXMF_REF }}
          path: rsLXMF
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXST
          ref: ${{ env.RATSPEAK_RSLXST_REF }}
          path: rsLXST
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/lrgp-rs
          ref: ${{ env.RATSPEAK_LRGP_REF }}
          path: lrgp-rs
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: false
          workspaces: Ratspeak
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libpcsclite-dev \
            libasound2-dev \
            libdbus-1-dev \
            pkg-config
      - run: cargo fmt --all -- --check
        working-directory: Ratspeak
      - name: Clippy (workspace, all targets and features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        working-directory: Ratspeak
      - name: Clippy (Tauri application shell)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
        working-directory: Ratspeak

  msrv:
    name: Rust 1.87 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Ratspeak
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RATSPEAK_RSRETICULUM_REF }}
          path: rsReticulum
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ env.RATSPEAK_RSLXMF_REF }}
          path: rsLXMF
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXST
          ref: ${{ env.RATSPEAK_RSLXST_REF }}
          path: rsLXST
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/lrgp-rs
          ref: ${{ env.RATSPEAK_LRGP_REF }}
          path: lrgp-rs
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.87.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: false
          workspaces: |
            Ratspeak
            Ratspeak/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libpcsclite-dev \
            libasound2-dev \
            libdbus-1-dev \
            pkg-config
      - name: Clippy (workspace, all targets and features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        working-directory: Ratspeak
      - name: Clippy (Tauri application shell)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
        working-directory: Ratspeak

  platform-check:
    name: Platform check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Ratspeak
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RATSPEAK_RSRETICULUM_REF }}
          path: rsReticulum
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ env.RATSPEAK_RSLXMF_REF }}
          path: rsLXMF
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXST
          ref: ${{ env.RATSPEAK_RSLXST_REF }}
          path: rsLXST
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/lrgp-rs
          ref: ${{ env.RATSPEAK_LRGP_REF }}
          path: lrgp-rs
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: false
          workspaces: |
            Ratspeak
            Ratspeak/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check desktop shell
        run: cargo check --manifest-path Ratspeak/src-tauri/Cargo.toml --locked

  mobile-rust-lint:
    name: Mobile gate (${{ matrix.target }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
            toolchain: stable
            native_android_lint: true
          - os: ubuntu-latest
            target: aarch64-linux-android
            toolchain: 1.87.0
            native_android_lint: false
          - os: macos-latest
            target: aarch64-apple-ios-sim
            toolchain: stable
            native_android_lint: false
          - os: macos-latest
            target: aarch64-apple-ios-sim
            toolchain: 1.87.0
            native_android_lint: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Ratspeak
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RATSPEAK_RSRETICULUM_REF }}
          path: rsReticulum
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ env.RATSPEAK_RSLXMF_REF }}
          path: rsLXMF
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXST
          ref: ${{ env.RATSPEAK_RSLXST_REF }}
          path: rsLXST
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/lrgp-rs
          ref: ${{ env.RATSPEAK_LRGP_REF }}
          path: lrgp-rs
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.native_android_lint
        with:
          node-version: 22.22.0
      - name: Load reviewed mobile toolchains
        if: matrix.native_android_lint
        id: mobile-source
        working-directory: Ratspeak
        run: node scripts/release/source-integrity.mjs github-outputs >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: false
          workspaces: Ratspeak/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        if: matrix.target == 'aarch64-linux-android'
        id: setup-ndk
        with:
          ndk-version: r27d
          add-to-path: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: matrix.native_android_lint
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: Ratspeak/src-tauri/gen/android/**/*.gradle*
      - name: Install Tauri CLI
        if: matrix.native_android_lint
        run: cargo install tauri-cli --version "${{ steps.mobile-source.outputs.tauri_cli }}" --locked
      - name: Clippy Android
        if: matrix.target == 'aarch64-linux-android'
        working-directory: Ratspeak
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          AR_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          TAURI_ANDROID_PROJECT_PATH: ${{ github.workspace }}/Ratspeak/src-tauri/gen/android
          TAURI_ANDROID_PACKAGE_UNESCAPED: org.ratspeak.android
          WRY_ANDROID_PACKAGE: org.ratspeak.android
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets --all-features --locked -- -D warnings
      - name: Build minified Android APK and run release lint
        if: matrix.native_android_lint
        working-directory: Ratspeak/src-tauri
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          TAURI_ANDROID_PROJECT_PATH: ${{ github.workspace }}/Ratspeak/src-tauri/gen/android
          TAURI_ANDROID_PACKAGE_UNESCAPED: org.ratspeak.android
          WRY_ANDROID_PACKAGE: org.ratspeak.android
        run: |
          test -s gen/android/tauri.settings.gradle
          test -s gen/android/app/tauri.build.gradle.kts
          unset TAURI_CONFIG
          unset TAURI_DEV_HOST
          cargo tauri android build --target aarch64 --apk -- --locked
          ./gen/android/gradlew -p gen/android :app:lintArm64Release --warning-mode all --no-daemon
          apk=gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          test -f "$apk"
          python3 ../scripts/release/assert-android-jni-boundaries.py archive "$apk"
      - name: Clippy iOS simulator
        if: matrix.target == 'aarch64-apple-ios-sim'
        working-directory: Ratspeak
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets --all-features --locked -- -D warnings
