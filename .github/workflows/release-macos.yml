name: Release macOS

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Exact tag or commit to build."
        required: true
        type: string
      release_tag:
        description: "Public version used in artifact names."
        required: true
        type: string
      qualify_release_ref:
        description: "Bind source BOMs to an existing annotated release tag."
        required: true
        type: boolean
      notarize:
        description: "Require Developer ID signing and Apple notarization."
        required: true
        type: boolean
      recovery_run_id:
        description: "Prior orchestrator run containing bounded-wait recovery state."
        required: false
        default: ""
        type: string
    secrets:
      APPLE_CERTIFICATE:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_SIGNING_IDENTITY:
        required: true
      APPLE_ID:
        required: true
      APPLE_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit or ref to build; defaults to the selected dispatch ref."
        required: false
        type: string
      release_tag:
        description: "Artifact version label; defaults to the selected ref name."
        required: false
        type: string
      qualify_release_ref:
        description: "Require release_tag to be the exact annotated product tag."
        required: true
        default: false
        type: boolean
      notarize:
        description: "Sign and notarize with Developer ID credentials"
        required: true
        default: false
        type: boolean
      recovery_run_id:
        description: "Resume notarization from this prior workflow run without rebuilding."
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-macos-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS
    if: ${{ inputs.recovery_run_id == '' }}
    runs-on: macos-latest
    timeout-minutes: 100
    steps:
      - name: Checkout Ratspeak
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Ratspeak
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup source qualification Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0

      - name: Load reviewed source set
        id: source
        shell: bash
        working-directory: Ratspeak
        run: node scripts/release/source-integrity.mjs github-outputs >> "$GITHUB_OUTPUT"

      - name: Checkout rsReticulum
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ steps.source.outputs.rsreticulum_ref }}
          path: rsReticulum
          fetch-depth: 0

      - name: Checkout rsLXMF
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ steps.source.outputs.rslxmf_ref }}
          path: rsLXMF
          fetch-depth: 0

      - name: Checkout rsLXST
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXST
          ref: ${{ steps.source.outputs.rslxst_ref }}
          path: rsLXST
          fetch-depth: 0

      - name: Checkout lrgp-rs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/lrgp-rs
          ref: ${{ steps.source.outputs.lrgp_ref }}
          path: lrgp-rs
          fetch-depth: 0

      - name: Verify reviewed source set
        shell: bash
        working-directory: Ratspeak
        run: node scripts/release/source-integrity.mjs verify-release-source

      - name: Verify qualified release ref
        if: ${{ inputs.qualify_release_ref }}
        shell: bash
        working-directory: Ratspeak
        env:
          RELEASE_REF: ${{ inputs.release_tag }}
        run: node scripts/release/source-integrity.mjs verify-release-ref "$RELEASE_REF"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ steps.source.outputs.rust_toolchain }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: true
          key: tauri-${{ steps.source.outputs.tauri_cli }}
          workspaces: |
            Ratspeak
            Ratspeak/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Tauri CLI
        shell: bash
        working-directory: Ratspeak
        run: bash scripts/release/install-tauri-cli.sh "${{ steps.source.outputs.tauri_cli }}"

      - name: Select reviewed Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Validate Apple toolchain
        shell: bash
        working-directory: Ratspeak
        run: bash scripts/release/assert-apple-toolchain.sh

      - name: Run tests
        working-directory: Ratspeak
        run: cargo test --workspace --locked

      - name: Build CSS
        shell: bash
        working-directory: Ratspeak
        run: bash dashboard/build-css.sh

      - name: Check Tauri desktop shell
        shell: bash
        working-directory: Ratspeak
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Import Developer ID certificate
        if: ${{ inputs.notarize }}
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required macOS signing secret: $name" >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/developer_id_application.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "RATSPEAK_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Build macOS DMGs
        shell: bash
        working-directory: Ratspeak/src-tauri
        env:
          MACOS_NOTARIZE: ${{ inputs.notarize }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Tauri checks this for the literal string "true"; any other value
          # keeps --skip-jenkins enabled, which skips the Finder .DS_Store layout.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          set -euo pipefail

          unset TAURI_CONFIG
          unset TAURI_DEV_HOST

          rm -rf target/aarch64-apple-darwin/release/bundle
          rm -rf target/x86_64-apple-darwin/release/bundle

          if [ "$MACOS_NOTARIZE" = "true" ]; then
            for name in APPLE_SIGNING_IDENTITY; do
              if [ -z "${!name:-}" ]; then
                echo "Missing required macOS signing value: $name" >&2
                exit 1
              fi
            done
            # Produce the final signed outer DMGs first. Apple credentials are
            # deliberately absent so Tauri cannot enter its opaque app-level
            # `notarytool submit --wait` path.
            unset APPLE_ID
            unset APPLE_PASSWORD
            unset APPLE_TEAM_ID
            unset APPLE_API_KEY
            unset APPLE_API_ISSUER
            unset APPLE_API_KEY_PATH
            cargo tauri build --target aarch64-apple-darwin --bundles dmg -- --locked
            cargo tauri build --target x86_64-apple-darwin --bundles dmg -- --locked
          else
            echo "Building ad-hoc signed release-profile macOS DMGs. Gatekeeper will warn until Developer ID notarization is enabled."
            unset APPLE_SIGNING_IDENTITY
            unset APPLE_ID
            unset APPLE_PASSWORD
            unset APPLE_TEAM_ID
            unset APPLE_API_KEY
            unset APPLE_API_ISSUER
            unset APPLE_API_KEY_PATH
            ad_hoc_signing_config='{"bundle":{"macOS":{"signingIdentity":"-","entitlements":"Entitlements.plist"}}}'
            cargo tauri build --target aarch64-apple-darwin --bundles dmg --config "$ad_hoc_signing_config" -- --locked
            cargo tauri build --target x86_64-apple-darwin --bundles dmg --config "$ad_hoc_signing_config" -- --locked
          fi

      - name: Stage macOS release artifacts
        shell: bash
        working-directory: Ratspeak
        env:
          RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}
          QUALIFY_RELEASE_REF: ${{ inputs.qualify_release_ref }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_VERSION:?Missing release version.}"
          case "$release_version" in
            */*|*\\*)
              echo "Release version must not contain path separators: $release_version" >&2
              exit 1
              ;;
          esac

          out_dir="dist/macos"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"

          stage_dmg() {
            local target="$1"
            local name="$2"
            local expected_arch="$3"
            local dmg_candidates=()
            local dmg
            while IFS= read -r -d '' candidate; do
              dmg_candidates+=("$candidate")
            done < <(find "src-tauri/target/$target/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -type f -print0)
            if [ "${#dmg_candidates[@]}" -ne 1 ]; then
              echo "Expected exactly one DMG for $target, found ${#dmg_candidates[@]}" >&2
              printf '%s\n' "${dmg_candidates[@]}" >&2
              exit 1
            fi
            dmg="${dmg_candidates[0]}"
            cp "$dmg" "$out_dir/$name"
            hdiutil verify "$out_dir/$name"
            bash scripts/release/verify-macos-dmg.sh "$out_dir/$name" "$expected_arch"
          }

          stage_dmg aarch64-apple-darwin "Ratspeak-${release_version}-macos-arm64.dmg" arm64
          stage_dmg x86_64-apple-darwin "Ratspeak-${release_version}-macos-x64.dmg" x86_64

          source_args=(bom --output "$out_dir/Ratspeak-${release_version}-macos-source-bom.json")
          if [[ "$QUALIFY_RELEASE_REF" == "true" ]]; then
            source_args+=(--release-ref "$release_version")
          fi
          node scripts/release/source-integrity.mjs "${source_args[@]}"

      - name: Notarize signed outer DMGs
        if: ${{ inputs.notarize }}
        shell: bash
        working-directory: Ratspeak
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NOTARY_WAIT_TIMEOUT: 30m
          RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}
        run: |
          bash scripts/release/notarize-macos-dmgs.sh \
            submit \
            dist/macos-notarization \
            "dist/macos/Ratspeak-${RELEASE_VERSION}-macos-arm64.dmg" \
            "dist/macos/Ratspeak-${RELEASE_VERSION}-macos-x64.dmg"

      - name: Preserve bounded-wait notarization recovery state
        if: ${{ failure() && inputs.notarize }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ratspeak-macos-notarization-recovery
          path: |
            Ratspeak/dist/macos/*
            Ratspeak/dist/macos-notarization/*
          if-no-files-found: warn
          retention-days: 7

      - name: Verify final macOS artifacts and write checksums
        shell: bash
        working-directory: Ratspeak
        env:
          RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}
          NOTARIZED: ${{ inputs.notarize }}
        run: bash scripts/release/finalize-macos-dmgs.sh "$RELEASE_VERSION" "$NOTARIZED"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ratspeak-macos
          path: Ratspeak/dist/macos/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing keychain
        if: ${{ always() && env.RATSPEAK_SIGNING_KEYCHAIN != '' }}
        shell: bash
        run: security delete-keychain "$RATSPEAK_SIGNING_KEYCHAIN" || true

  resume:
    name: macOS notarization resume
    if: ${{ inputs.recovery_run_id != '' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Ratspeak
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Ratspeak
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Verify qualified release ref
        if: ${{ inputs.qualify_release_ref }}
        shell: bash
        working-directory: Ratspeak
        env:
          RELEASE_REF: ${{ inputs.release_tag }}
        run: node scripts/release/source-integrity.mjs verify-release-ref "$RELEASE_REF"

      - name: Select reviewed Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Download notarization recovery state
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ratspeak-macos-notarization-recovery
          path: Ratspeak/dist
          repository: ${{ github.repository }}
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}

      - name: Resume bounded Apple notarization wait
        shell: bash
        working-directory: Ratspeak
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NOTARY_WAIT_TIMEOUT: 30m
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: |
          bash scripts/release/notarize-macos-dmgs.sh \
            resume \
            dist/macos-notarization \
            "dist/macos/Ratspeak-${RELEASE_VERSION}-macos-arm64.dmg" \
            "dist/macos/Ratspeak-${RELEASE_VERSION}-macos-x64.dmg"

      - name: Verify final macOS artifacts and write checksums
        shell: bash
        working-directory: Ratspeak
        env:
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: bash scripts/release/finalize-macos-dmgs.sh "$RELEASE_VERSION" true

      - name: Upload final macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ratspeak-macos
          path: Ratspeak/dist/macos/*
          if-no-files-found: error
          retention-days: 7
