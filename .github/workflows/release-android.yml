name: Release Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: "Publish APK artifacts to a GitHub Release"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag to publish when manually dispatching."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease."
        required: true
        default: true
        type: boolean
      upload_play:
        description: "Upload the signed AAB to Google Play."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Android
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Checkout Ratspeak
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Ratspeak
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Setup source qualification Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0

      - name: Load reviewed source set
        id: source
        shell: bash
        working-directory: Ratspeak
        run: node scripts/release/source-integrity.mjs github-outputs >> "$GITHUB_OUTPUT"

      - name: Checkout rsReticulum
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ steps.source.outputs.rsreticulum_ref }}
          path: rsReticulum
          fetch-depth: 0

      - name: Checkout rsLXMF
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ steps.source.outputs.rslxmf_ref }}
          path: rsLXMF
          fetch-depth: 0

      - name: Checkout rsLXST
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXST
          ref: ${{ steps.source.outputs.rslxst_ref }}
          path: rsLXST
          fetch-depth: 0

      - name: Checkout lrgp-rs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/lrgp-rs
          ref: ${{ steps.source.outputs.lrgp_ref }}
          path: lrgp-rs
          fetch-depth: 0

      - name: Verify reviewed source set
        shell: bash
        working-directory: Ratspeak
        run: node scripts/release/source-integrity.mjs verify-release-source

      - name: Verify publishing release ref
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        shell: bash
        working-directory: Ratspeak
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: node scripts/release/source-integrity.mjs verify-release-ref "$RELEASE_REF"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ steps.source.outputs.rust_toolchain }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ steps.source.outputs.java }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android NDK
        shell: bash
        run: |
          set +e +o pipefail
          yes | sdkmanager "ndk;${{ steps.source.outputs.android_ndk }}"
          sdkmanager_status=${PIPESTATUS[1]}
          set -e -o pipefail
          if [ "$sdkmanager_status" -ne 0 ]; then
            exit "$sdkmanager_status"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ steps.source.outputs.android_ndk }}" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: false
          workspaces: |
            Ratspeak
            Ratspeak/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ steps.source.outputs.tauri_cli }}" --locked

      - name: Build CSS
        shell: bash
        working-directory: Ratspeak
        run: bash dashboard/build-css.sh

      - name: Configure Android signing
        shell: bash
        working-directory: Ratspeak
        env:
          ANDROID_SIGNING_REQUIRED: "1"
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: bash scripts/release/setup-android-signing.sh

      - name: Build signed Android APKs
        shell: bash
        working-directory: Ratspeak/src-tauri
        run: |
          unset TAURI_CONFIG
          unset TAURI_DEV_HOST
          cargo tauri android build --target aarch64 armv7 x86_64 --apk --split-per-abi -- --locked

      - name: Lint Android release variant
        shell: bash
        working-directory: Ratspeak/src-tauri/gen/android
        run: ./gradlew :app:lintArm64Release --warning-mode all

      - name: Build signed Android AAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_play }}
        shell: bash
        working-directory: Ratspeak/src-tauri
        run: |
          unset TAURI_CONFIG
          unset TAURI_DEV_HOST
          cargo tauri android build --target aarch64 armv7 x86_64 --aab -- --locked

      - name: Validate Android JNI boundaries in final artifacts
        shell: bash
        working-directory: Ratspeak
        run: |
          python3 scripts/release/assert-android-jni-boundaries.py source
          mapfile -d '' artifacts < <(
            find src-tauri/gen/android/app/build/outputs -type f \
              \( -name '*.apk' -o -name '*.aab' \) -print0
          )
          test "${#artifacts[@]}" -ge 3
          for artifact in "${artifacts[@]}"; do
            python3 scripts/release/assert-android-jni-boundaries.py archive "$artifact"
          done

      - name: Check for bundled dev URLs
        shell: bash
        working-directory: Ratspeak
        run: bash scripts/release/assert-no-tauri-dev-url.sh src-tauri/gen/android/app/build/outputs

      - name: Stage Android release APKs
        shell: bash
        working-directory: Ratspeak
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          PUBLISH_GITHUB_RELEASE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_VERSION:?Missing release version.}"
          case "$release_version" in
            */*|*\\*)
              echo "Release version must not contain path separators: $release_version" >&2
              exit 1
              ;;
          esac

          out_dir="dist/android"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"
          cp src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk "$out_dir/Ratspeak-${release_version}-android-arm64.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/arm/release/app-arm-release.apk "$out_dir/Ratspeak-${release_version}-android-armv7.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/x86_64/release/app-x86_64-release.apk "$out_dir/Ratspeak-${release_version}-android-x86_64.apk"

          source_args=(bom --output "$out_dir/Ratspeak-${release_version}-android-source-bom.json")
          if [[ "$PUBLISH_GITHUB_RELEASE" == "true" ]]; then
            source_args+=(--release-ref "$release_version")
          fi
          node scripts/release/source-integrity.mjs "${source_args[@]}"

      - name: Write APK checksums
        shell: bash
        working-directory: Ratspeak
        run: |
          checksum_file="checksums-android.txt"
          : > "$checksum_file"
          find dist/android -type f -print0 |
            sort -z |
            while IFS= read -r -d '' artifact; do
              hash="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
              printf '%s  %s\n' "$hash" "$(basename "$artifact")" >> "$checksum_file"
            done
          test -s "$checksum_file"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ratspeak-android
          path: |
            Ratspeak/src-tauri/gen/android/app/build/outputs/**/*.aab
            Ratspeak/dist/android/*
            Ratspeak/checksums-android.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          prerelease: ${{ github.event_name == 'push' || inputs.prerelease }}
          body: |
            - Public Channels beta: connect, discover, share, and join live RRC hubs with local history, unread counts, mentions, presence, and identity avatars
            - Bidirectional RRC messages and actions with authenticated reconnect/rejoin and safer malformed-peer handling
            - Opt-in hub hosting with graphical room, access, moderation, and discovery controls
            - Mobile Channels polish for keyboard resizing, safe areas, Back navigation, sheets, and partial member lists
            - Privacy-bounded Activity diagnostics plus broader Reticulum, LXMF, and LXST reliability fixes
          files: |
            Ratspeak/dist/android/*
            Ratspeak/checksums-android.txt

      - name: Upload to Google Play
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_play }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME || 'org.ratspeak.android' }}
          releaseFiles: Ratspeak/src-tauri/gen/android/app/build/outputs/**/*.aab
          track: ${{ vars.GOOGLE_PLAY_TRACK || 'internal' }}
          status: draft
