name: Build Desktop (Linux + Windows)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

env:
  # Keep these ordinary CI/manual-build pins aligned with the reviewed
  # dependency set. Release workflows load the same commits directly.
  RATSPEAK_RSRETICULUM_REF: 5b38cae702a5b3984adf12a435f6d3012fcf90e1
  RATSPEAK_RSLXMF_REF: b5c3365b5715f1f36f74963a9d2136238d956467
  RATSPEAK_RSLXST_REF: 8f8e664427b03c4440778bd6b63b65055fd2ad14
  RATSPEAK_LRGP_REF: 660e4cf100a74eec8d3521594d3fb74587de05ef

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: ratspeak-linux-amd64
            build_command: cargo tauri build --bundles deb appimage rpm -- --locked
            debug_build_command: cargo tauri build --debug --bundles deb appimage rpm -- --locked
            artifact_path: |
              Ratspeak/src-tauri/target/release/bundle/deb/*.deb
              Ratspeak/src-tauri/target/release/bundle/appimage/*.AppImage
              Ratspeak/src-tauri/target/release/bundle/rpm/*.rpm
            debug_artifact_path: |
              Ratspeak/src-tauri/target/debug/bundle/deb/*.deb
              Ratspeak/src-tauri/target/debug/bundle/appimage/*.AppImage
              Ratspeak/src-tauri/target/debug/bundle/rpm/*.rpm
          - os: ubuntu-22.04-arm
            artifact_name: ratspeak-linux-arm64
            build_command: cargo tauri build --bundles deb -- --locked
            debug_build_command: cargo tauri build --debug --bundles deb -- --locked
            artifact_path: |
              Ratspeak/src-tauri/target/release/bundle/deb/*.deb
            debug_artifact_path: |
              Ratspeak/src-tauri/target/debug/bundle/deb/*.deb
          - os: windows-latest
            artifact_name: ratspeak-windows
            build_command: cargo tauri build -- --locked
            debug_build_command: cargo tauri build --debug -- --locked
            artifact_path: |
              Ratspeak/src-tauri/target/release/bundle/msi/*.msi
              Ratspeak/src-tauri/target/release/bundle/nsis/*.exe
            debug_artifact_path: |
              Ratspeak/src-tauri/target/debug/bundle/msi/*.msi
              Ratspeak/src-tauri/target/debug/bundle/nsis/*.exe
    steps:
      # Check out repos into $GITHUB_WORKSPACE as siblings so Cargo
      # `../rsReticulum` path deps resolve correctly.
      - name: Checkout Ratspeak
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Ratspeak
          fetch-depth: 0

      - name: Setup source qualification Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0

      - name: Load reviewed source set
        id: source
        shell: bash
        working-directory: Ratspeak
        run: node scripts/release/source-integrity.mjs github-outputs >> "$GITHUB_OUTPUT"

      - name: Checkout rsReticulum sibling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RATSPEAK_RSRETICULUM_REF }}
          path: rsReticulum
          fetch-depth: 0

      - name: Checkout rsLXMF sibling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ env.RATSPEAK_RSLXMF_REF }}
          path: rsLXMF
          fetch-depth: 0

      - name: Checkout rsLXST sibling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXST
          ref: ${{ env.RATSPEAK_RSLXST_REF }}
          path: rsLXST
          fetch-depth: 0

      - name: Checkout lrgp-rs sibling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/lrgp-rs
          ref: ${{ env.RATSPEAK_LRGP_REF }}
          path: lrgp-rs
          fetch-depth: 0

      - name: Validate ordinary workflow dependency pins
        working-directory: Ratspeak
        run: bash scripts/ci/check-workflow-dependency-pins.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: true
          key: tauri-${{ steps.source.outputs.tauri_cli }}
          workspaces: |
            Ratspeak
            Ratspeak/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' && inputs.profile == 'release' }}

      - name: Install Linux system deps
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libpcsclite-dev \
            libasound2-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            libfuse2 \
            rpm \
            file

      # dpkg-dev: GTK plugin; GStreamer: source of the plugins staged for
      # bundleMediaFramework; squashfs-tools: AppImage gate extraction.
      - name: Install AppImage bundling deps
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt-get install -y \
            dpkg-dev \
            squashfs-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-alsa \
            gstreamer1.0-gl

      - name: Install Tauri CLI
        shell: bash
        working-directory: Ratspeak
        run: bash scripts/release/install-tauri-cli.sh "${{ steps.source.outputs.tauri_cli }}"

      - name: Stage AppImage indicator runtime and GStreamer plugins
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        working-directory: Ratspeak
        run: bash scripts/release/stage-appimage-runtime.sh

      - name: Build CSS
        shell: bash
        working-directory: Ratspeak
        run: bash dashboard/build-css.sh

      - name: Build Tauri desktop app (release)
        if: ${{ inputs.profile == 'release' }}
        working-directory: Ratspeak/src-tauri
        run: ${{ matrix.build_command }}

      - name: Build Tauri desktop app (debug)
        if: ${{ inputs.profile == 'debug' }}
        working-directory: Ratspeak/src-tauri
        run: ${{ matrix.debug_build_command }}

      - name: Verify AppImage indicator runtime
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        shell: bash
        working-directory: Ratspeak
        env:
          BUILD_PROFILE: ${{ inputs.profile == 'debug' && 'debug' || 'release' }}
        run: |
          mapfile -t appimages < <(find "src-tauri/target/$BUILD_PROFILE/bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' | sort)
          test "${#appimages[@]}" = "1"
          bash scripts/release/verify-appimage-runtime.sh "${appimages[0]}"

      - name: Verify Linux package dependencies
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        shell: bash
        working-directory: Ratspeak
        env:
          BUILD_PROFILE: ${{ inputs.profile == 'debug' && 'debug' || 'release' }}
        run: |
          mapfile -t packages < <(find "src-tauri/target/$BUILD_PROFILE/bundle/deb" "src-tauri/target/$BUILD_PROFILE/bundle/rpm" -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' \) 2>/dev/null | sort)
          test "${#packages[@]}" -ge 1
          bash scripts/release/verify-linux-package-deps.sh "${packages[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ inputs.profile == 'debug' && matrix.debug_artifact_path || matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
