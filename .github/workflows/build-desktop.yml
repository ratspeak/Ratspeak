name: Build Desktop (Linux + Windows)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

env:
  # Keep these ordinary CI/manual-build pins aligned with the reviewed
  # dependency set. Release workflows load the same commits directly.
  RATSPEAK_RSRETICULUM_REF: 4a924ce2819a55fb3bf70bca0aff86c8c2174c91
  RATSPEAK_RSLXMF_REF: c0053734f5e48c18564bebbbe16f8f6ac61b4a92
  RATSPEAK_RSLXST_REF: e776d68b9b9158906c1665bc5dbaaa92455eba95
  RATSPEAK_LRGP_REF: 856685687eab140efcea1c2d79bacd66d228c510

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: ratspeak-linux-amd64
            build_command: cargo tauri build --bundles deb appimage rpm -- --locked
            debug_build_command: cargo tauri build --debug --bundles deb appimage rpm -- --locked
            artifact_path: |
              Ratspeak/src-tauri/target/release/bundle/deb/*.deb
              Ratspeak/src-tauri/target/release/bundle/appimage/*.AppImage
              Ratspeak/src-tauri/target/release/bundle/rpm/*.rpm
            debug_artifact_path: |
              Ratspeak/src-tauri/target/debug/bundle/deb/*.deb
              Ratspeak/src-tauri/target/debug/bundle/appimage/*.AppImage
              Ratspeak/src-tauri/target/debug/bundle/rpm/*.rpm
          - os: ubuntu-22.04-arm
            artifact_name: ratspeak-linux-arm64
            build_command: cargo tauri build --bundles deb -- --locked
            debug_build_command: cargo tauri build --debug --bundles deb -- --locked
            artifact_path: |
              Ratspeak/src-tauri/target/release/bundle/deb/*.deb
            debug_artifact_path: |
              Ratspeak/src-tauri/target/debug/bundle/deb/*.deb
          - os: windows-latest
            artifact_name: ratspeak-windows
            build_command: cargo tauri build -- --locked
            debug_build_command: cargo tauri build --debug -- --locked
            artifact_path: |
              Ratspeak/src-tauri/target/release/bundle/msi/*.msi
              Ratspeak/src-tauri/target/release/bundle/nsis/*.exe
            debug_artifact_path: |
              Ratspeak/src-tauri/target/debug/bundle/msi/*.msi
              Ratspeak/src-tauri/target/debug/bundle/nsis/*.exe
    steps:
      # Check out repos into $GITHUB_WORKSPACE as siblings so Cargo
      # `../rsReticulum` path deps resolve correctly.
      - name: Checkout Ratspeak
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Ratspeak
          fetch-depth: 0

      - name: Checkout rsReticulum sibling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RATSPEAK_RSRETICULUM_REF }}
          path: rsReticulum
          fetch-depth: 0

      - name: Checkout rsLXMF sibling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ env.RATSPEAK_RSLXMF_REF }}
          path: rsLXMF
          fetch-depth: 0

      - name: Checkout rsLXST sibling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXST
          ref: ${{ env.RATSPEAK_RSLXST_REF }}
          path: rsLXST
          fetch-depth: 0

      - name: Checkout lrgp-rs sibling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/lrgp-rs
          ref: ${{ env.RATSPEAK_LRGP_REF }}
          path: lrgp-rs
          fetch-depth: 0

      - name: Validate ordinary workflow dependency pins
        working-directory: Ratspeak
        run: bash scripts/ci/check-workflow-dependency-pins.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: false
          workspaces: |
            Ratspeak
            Ratspeak/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' && inputs.profile == 'release' }}

      - name: Install Linux system deps
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libpcsclite-dev \
            libasound2-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            libfuse2 \
            rpm \
            file

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "2.11.1" --locked

      - name: Build CSS
        shell: bash
        working-directory: Ratspeak
        run: bash dashboard/build-css.sh

      - name: Build Tauri desktop app (release)
        if: ${{ inputs.profile == 'release' }}
        working-directory: Ratspeak/src-tauri
        run: ${{ matrix.build_command }}

      - name: Build Tauri desktop app (debug)
        if: ${{ inputs.profile == 'debug' }}
        working-directory: Ratspeak/src-tauri
        run: ${{ matrix.debug_build_command }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ inputs.profile == 'debug' && matrix.debug_artifact_path || matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
