name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: "Publish Windows artifacts to a GitHub Release"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag to publish when manually dispatching."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease."
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout Ratspeak
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Ratspeak
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Load reviewed source set
        id: source
        shell: bash
        working-directory: Ratspeak
        run: node scripts/release/source-integrity.mjs github-outputs >> "$GITHUB_OUTPUT"

      - name: Checkout rsReticulum
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ steps.source.outputs.rsreticulum_ref }}
          path: rsReticulum
          fetch-depth: 0

      - name: Checkout rsLXMF
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ steps.source.outputs.rslxmf_ref }}
          path: rsLXMF
          fetch-depth: 0

      - name: Checkout rsLXST
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXST
          ref: ${{ steps.source.outputs.rslxst_ref }}
          path: rsLXST
          fetch-depth: 0

      - name: Checkout lrgp-rs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/lrgp-rs
          ref: ${{ steps.source.outputs.lrgp_ref }}
          path: lrgp-rs
          fetch-depth: 0

      - name: Verify reviewed source set
        shell: bash
        working-directory: Ratspeak
        run: node scripts/release/source-integrity.mjs verify-release-source

      - name: Verify publishing release ref
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        shell: pwsh
        working-directory: Ratspeak
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          & node scripts/release/source-integrity.mjs verify-release-ref "$env:RELEASE_REF"
          if ($LASTEXITCODE -ne 0) {
            throw "Release ref verification failed."
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ steps.source.outputs.rust_toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: false
          workspaces: |
            Ratspeak
            Ratspeak/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ steps.source.outputs.tauri_cli }}" --locked

      - name: Run tests
        working-directory: Ratspeak
        run: cargo test --workspace --locked

      - name: Build CSS
        shell: bash
        working-directory: Ratspeak
        run: bash dashboard/build-css.sh

      - name: Check Tauri desktop shell
        shell: bash
        working-directory: Ratspeak
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Tauri Windows installers
        shell: bash
        working-directory: Ratspeak/src-tauri
        run: |
          unset TAURI_CONFIG
          unset TAURI_DEV_HOST
          cargo tauri build --bundles msi nsis -- --locked

      - name: Check for bundled dev URLs
        shell: bash
        working-directory: Ratspeak
        run: bash scripts/release/assert-no-tauri-dev-url.sh src-tauri/target/release/bundle

      - name: Stage Windows release artifacts
        shell: pwsh
        working-directory: Ratspeak
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          PUBLISH_GITHUB_RELEASE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "$env:RELEASE_VERSION".Trim()
          if (-not $version) {
            throw "Missing release version."
          }
          if ($version -match '[\\/]') {
            throw "Release version must not contain path separators: $version"
          }

          $outDir = "dist/windows"
          Remove-Item -Recurse -Force $outDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $outDir | Out-Null

          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File |
            Sort-Object FullName |
            Select-Object -First 1
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File |
            Sort-Object FullName |
            Select-Object -First 1

          if (-not $msi) {
            throw "Missing Windows MSI artifact."
          }
          if (-not $setup) {
            throw "Missing Windows NSIS setup executable."
          }

          $msiName = "Ratspeak-$version-windows-x64.msi"
          $setupName = "Ratspeak-$version-windows-x64-setup.exe"
          Copy-Item $msi.FullName "$outDir/$msiName"
          Copy-Item $setup.FullName "$outDir/$setupName"

          $bomArgs = @(
            "scripts/release/source-integrity.mjs",
            "bom",
            "--output",
            "$outDir/Ratspeak-$version-windows-source-bom.json"
          )
          if ($env:PUBLISH_GITHUB_RELEASE -eq "true") {
            $bomArgs += @("--release-ref", $version)
          }
          & node @bomArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Source BOM generation failed."
          }

          Get-Item "$outDir/$msiName", "$outDir/$setupName", "$outDir/Ratspeak-$version-windows-source-bom.json" |
            Format-Table Name, Length

      - name: Write Windows checksums
        shell: pwsh
        working-directory: Ratspeak
        run: |
          $ErrorActionPreference = "Stop"
          $checksumFile = "checksums-windows.txt"
          $lines = Get-ChildItem "dist/windows" -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }

          if (-not $lines) {
            throw "No Windows artifacts found for checksums."
          }

          $checksumPath = Join-Path (Get-Location) $checksumFile
          $contents = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            $checksumPath,
            $contents,
            [System.Text.Encoding]::ASCII
          )

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ratspeak-windows
          path: |
            Ratspeak/dist/windows/*
            Ratspeak/checksums-windows.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          prerelease: ${{ github.event_name == 'push' || inputs.prerelease }}
          body: |
            - Public Channels beta: connect, discover, share, and join live RRC hubs with local history, unread counts, mentions, presence, and identity avatars
            - Bidirectional RRC messages and actions with authenticated reconnect/rejoin and safer malformed-peer handling
            - Opt-in hub hosting with graphical room, access, moderation, and discovery controls
            - Mobile Channels polish for keyboard resizing, safe areas, Back navigation, sheets, and partial member lists
            - Privacy-bounded Activity diagnostics plus broader Reticulum, LXMF, and LXST reliability fixes
          files: |
            Ratspeak/dist/windows/*
            Ratspeak/checksums-windows.txt
