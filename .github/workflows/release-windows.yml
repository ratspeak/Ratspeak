name: Release Windows

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Exact tag or commit to build."
        required: true
        type: string
      release_tag:
        description: "Public version used in artifact names."
        required: true
        type: string
      qualify_release_ref:
        description: "Bind source BOMs to an existing annotated release tag."
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit or ref to build; defaults to the selected dispatch ref."
        required: false
        type: string
      release_tag:
        description: "Artifact version label; defaults to the selected ref name."
        required: false
        type: string
      qualify_release_ref:
        description: "Require release_tag to be the exact annotated product tag."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-windows-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Preserve source bytes
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout Ratspeak
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Ratspeak
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup source qualification Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0

      - name: Load reviewed source set
        id: source
        shell: bash
        working-directory: Ratspeak
        run: node scripts/release/source-integrity.mjs github-outputs >> "$GITHUB_OUTPUT"

      - name: Checkout rsReticulum
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ steps.source.outputs.rsreticulum_ref }}
          path: rsReticulum
          fetch-depth: 0

      - name: Checkout rsLXMF
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ steps.source.outputs.rslxmf_ref }}
          path: rsLXMF
          fetch-depth: 0

      - name: Checkout rsLXST
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXST
          ref: ${{ steps.source.outputs.rslxst_ref }}
          path: rsLXST
          fetch-depth: 0

      - name: Checkout lrgp-rs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/lrgp-rs
          ref: ${{ steps.source.outputs.lrgp_ref }}
          path: lrgp-rs
          fetch-depth: 0

      - name: Verify reviewed source set
        shell: bash
        working-directory: Ratspeak
        run: node scripts/release/source-integrity.mjs verify-release-source

      - name: Verify qualified release ref
        if: ${{ inputs.qualify_release_ref }}
        shell: pwsh
        working-directory: Ratspeak
        env:
          RELEASE_REF: ${{ inputs.release_tag }}
        run: |
          & node scripts/release/source-integrity.mjs verify-release-ref "$env:RELEASE_REF"
          if ($LASTEXITCODE -ne 0) {
            throw "Release ref verification failed."
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ steps.source.outputs.rust_toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: true
          key: tauri-${{ steps.source.outputs.tauri_cli }}
          workspaces: |
            Ratspeak
            Ratspeak/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Tauri CLI
        shell: bash
        working-directory: Ratspeak
        run: bash scripts/release/install-tauri-cli.sh "${{ steps.source.outputs.tauri_cli }}"

      - name: Run tests
        working-directory: Ratspeak
        run: cargo test --workspace --locked

      - name: Build CSS
        shell: bash
        working-directory: Ratspeak
        run: bash dashboard/build-css.sh

      - name: Check Tauri desktop shell
        shell: bash
        working-directory: Ratspeak
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Tauri Windows installers
        shell: bash
        working-directory: Ratspeak/src-tauri
        run: |
          unset TAURI_CONFIG
          unset TAURI_DEV_HOST
          cargo tauri build --bundles msi nsis -- --locked

      - name: Check for bundled dev URLs
        shell: bash
        working-directory: Ratspeak
        run: bash scripts/release/assert-no-tauri-dev-url.sh src-tauri/target/release/bundle

      - name: Stage Windows release artifacts
        shell: pwsh
        working-directory: Ratspeak
        env:
          RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}
          QUALIFY_RELEASE_REF: ${{ inputs.qualify_release_ref }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "$env:RELEASE_VERSION".Trim()
          if (-not $version) {
            throw "Missing release version."
          }
          if ($version -match '[\\/]') {
            throw "Release version must not contain path separators: $version"
          }

          $outDir = "dist/windows"
          Remove-Item -Recurse -Force $outDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $outDir | Out-Null

          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File |
            Sort-Object FullName |
            Select-Object -First 1
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File |
            Sort-Object FullName |
            Select-Object -First 1

          if (-not $msi) {
            throw "Missing Windows MSI artifact."
          }
          if (-not $setup) {
            throw "Missing Windows NSIS setup executable."
          }

          $msiName = "Ratspeak-$version-windows-x64.msi"
          $setupName = "Ratspeak-$version-windows-x64-setup.exe"
          Copy-Item $msi.FullName "$outDir/$msiName"
          Copy-Item $setup.FullName "$outDir/$setupName"

          $bomArgs = @(
            "scripts/release/source-integrity.mjs",
            "bom",
            "--output",
            "$outDir/Ratspeak-$version-windows-source-bom.json"
          )
          if ($env:QUALIFY_RELEASE_REF -eq "true") {
            $bomArgs += @("--release-ref", $version)
          }
          & node @bomArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Source BOM generation failed."
          }

          Get-Item "$outDir/$msiName", "$outDir/$setupName", "$outDir/Ratspeak-$version-windows-source-bom.json" |
            Format-Table Name, Length

      - name: Write Windows checksums
        shell: pwsh
        working-directory: Ratspeak
        run: |
          $ErrorActionPreference = "Stop"
          $checksumFile = "checksums-windows.txt"
          $lines = Get-ChildItem "dist/windows" -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }

          if (-not $lines) {
            throw "No Windows artifacts found for checksums."
          }

          $checksumPath = Join-Path (Get-Location) "dist/windows/$checksumFile"
          $contents = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            $checksumPath,
            $contents,
            [System.Text.Encoding]::ASCII
          )

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ratspeak-windows
          path: Ratspeak/dist/windows/*
          if-no-files-found: error
          retention-days: 7
